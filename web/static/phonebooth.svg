<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 460" width="240" height="460" fill="none">
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6ce0ff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#b58bff" stop-opacity="0.06"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="40%" r="62%">
      <stop offset="0" stop-color="#6ce0ff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#6ce0ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g opacity="0.55">
    <!-- glow of the Circuits of History behind the booth -->
    <ellipse cx="120" cy="210" rx="128" ry="210" fill="url(#halo)"/>

    <g stroke="#6ce0ff" stroke-width="2.5" stroke-linejoin="round" filter="url(#glow)">
      <!-- top sign box -->
      <rect x="46" y="26" width="148" height="40" rx="6" fill="#0d1430"/>
      <!-- booth frame -->
      <rect x="52" y="66" width="136" height="352" rx="10" fill="url(#glass)"/>
      <!-- inner glass -->
      <rect x="64" y="78" width="112" height="300" rx="6" fill="none" stroke-width="1.6"/>
      <!-- window mullions + door seam -->
      <line x1="64" y1="150" x2="176" y2="150" stroke-width="1.4"/>
      <line x1="64" y1="230" x2="176" y2="230" stroke-width="1.4"/>
      <line x1="120" y1="78" x2="120" y2="378" stroke-width="1.4"/>
      <!-- base / plinth -->
      <rect x="44" y="418" width="152" height="18" rx="4" fill="#0d1430"/>
    </g>

    <!-- PHONE sign -->
    <text x="120" y="53" text-anchor="middle"
          font-family="Menlo, ui-monospace, monospace" font-size="17" font-weight="700"
          letter-spacing="3" fill="#6ce0ff" filter="url(#glow)">PHONE</text>

    <!-- time-travel lightning -->
    <g stroke="#b58bff" stroke-width="2.5" stroke-linejoin="round" fill="none"
       filter="url(#glow)" opacity="0.9">
      <path d="M26 118 l14 -6 -6 16 14 -4"/>
      <path d="M214 302 l-14 6 6 -16 -14 4"/>
    </g>
  </g>
</svg>
