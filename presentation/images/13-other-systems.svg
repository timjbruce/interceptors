<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<defs><marker id="a-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6ce0ff"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b58bff"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3ad29f"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ff6b8b"/></marker><marker id="a-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ffcf6b"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a95c0"/></marker><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e7ecff"/></marker><radialGradient id="halo" cx="72%" cy="-6%" r="80%"><stop offset="0" stop-color="#1a2450"/><stop offset="1" stop-color="#0b1020"/></radialGradient><linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6ce0ff" stop-opacity="0.14"/><stop offset="1" stop-color="#b58bff" stop-opacity="0.05"/></linearGradient><pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0 H0 V48" fill="none" stroke="#263056" stroke-width="1"/></pattern><linearGradient id="tlogo" x1="183" y1="192" x2="0" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#444CE7"/><stop offset="1" stop-color="#B664FF"/></linearGradient><filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="1280" height="720" fill="url(#halo)"/>
<rect width="1280" height="720" fill="url(#grid)" opacity="0.35"/>
<rect x="72" y="60" width="5" height="92" rx="2.5" fill="#b58bff"/>
<text x="100" y="100" font-size="42" fill="#e7ecff" font-weight="700" text-anchor="start" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" opacity="1.0">Then Rufus told the rest of IT</text>
<text x="100" y="140" font-size="21" fill="#8a95c0" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" opacity="1.0">Same five places to hook in. Every other system had similar requirements.</text>
<rect x="96" y="196" width="342" height="208" rx="14" fill="#141b32" fill-opacity="0.85" stroke="#b58bff" stroke-width="1.6"/>
<rect x="96" y="196" width="4" height="208" rx="2" fill="#b58bff"/>
<text x="118" y="240" font-size="19" fill="#e7ecff" font-weight="700" text-anchor="start" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" opacity="1.0">Distributed tracing</text>
<text x="118" y="274" font-size="15" fill="#8a95c0" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" opacity="1.0">One OpenTelemetry span per</text>
<text x="118" y="296" font-size="15" fill="#8a95c0" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" opacity="1.0">workflow and activity, context on</text>
<text x="118" y="318" font-size="15" fill="#8a95c0" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" opacity="1.0">the header.</text>
<rect x="118" y="352" width="146" height="28" rx="14.0" fill="#b58bff" fill-opacity="0.12" stroke="#b58bff" stroke-width="1.4"/>
<text x="191.12" y="370.32" font-size="12" fill="#b58bff" font-weight="600" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" opacity="1.0">client and worker</text>
<rect x="462" y="196" width="342" height="208" rx="14" fill="#141b32" fill-opacity="0.85" stroke="#b58bff" stroke-width="1.6"/>
<rect x="462" y="196" width="4" height="208" rx="2" fill="#b58bff"/>
<text x="484" y="240" font-size="19" fill="#e7ecff" font-weight="700" text-anchor="start" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" opacity="1.0">Metrics by workflow type</text>
<text x="484" y="274" font-size="15" fill="#8a95c0" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" opacity="1.0">Count and time every execution</text>
<text x="484" y="296" font-size="15" fill="#8a95c0" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" opacity="1.0">without touching a workflow.</text>
<rect x="484" y="352" width="227" height="28" rx="14.0" fill="#b58bff" fill-opacity="0.12" stroke="#b58bff" stroke-width="1.4"/>
<text x="597.44" y="370.32" font-size="12" fill="#b58bff" font-weight="600" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" opacity="1.0">activity and workflow inbound</text>
<rect x="828" y="196" width="342" height="208" rx="14" fill="#141b32" fill-opacity="0.85" stroke="#b58bff" stroke-width="1.6"/>
<rect x="828" y="196" width="4" height="208" rx="2" fill="#b58bff"/>
<text x="850" y="240" font-size="19" fill="#e7ecff" font-weight="700" text-anchor="start" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" opacity="1.0">Tenant and locale context</text>
<text x="850" y="274" font-size="15" fill="#8a95c0" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" opacity="1.0">Carry tenant, region and feature</text>
<text x="850" y="296" font-size="15" fill="#8a95c0" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" opacity="1.0">flags to every child and activity.</text>
<rect x="850" y="352" width="220" height="28" rx="14.0" fill="#b58bff" fill-opacity="0.12" stroke="#b58bff" stroke-width="1.4"/>
<text x="960.08" y="370.32" font-size="12" fill="#b58bff" font-weight="600" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" opacity="1.0">client and workflow outbound</text>
<rect x="96" y="432" width="342" height="208" rx="14" fill="#141b32" fill-opacity="0.85" stroke="#b58bff" stroke-width="1.6"/>
<rect x="96" y="432" width="4" height="208" rx="2" fill="#b58bff"/>
<text x="118" y="476" font-size="19" fill="#e7ecff" font-weight="700" text-anchor="start" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" opacity="1.0">PII-safe logging</text>
<text x="118" y="510" font-size="15" fill="#8a95c0" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" opacity="1.0">Log shapes, not payloads. One</text>
<text x="118" y="532" font-size="15" fill="#8a95c0" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" opacity="1.0">redaction rule, applied</text>
<text x="118" y="554" font-size="15" fill="#8a95c0" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" opacity="1.0">everywhere.</text>
<rect x="118" y="588" width="119" height="28" rx="14.0" fill="#b58bff" fill-opacity="0.12" stroke="#b58bff" stroke-width="1.4"/>
<text x="177.68" y="606.32" font-size="12" fill="#b58bff" font-weight="600" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" opacity="1.0">inbound hooks</text>
<rect x="462" y="432" width="342" height="208" rx="14" fill="#141b32" fill-opacity="0.85" stroke="#ff7ae0" stroke-width="1.6"/>
<rect x="462" y="432" width="4" height="208" rx="2" fill="#ff7ae0"/>
<text x="484" y="476" font-size="19" fill="#e7ecff" font-weight="700" text-anchor="start" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" opacity="1.0">Refuse work before it starts</text>
<text x="484" y="510" font-size="15" fill="#8a95c0" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" opacity="1.0">Unauthorized requests never begin,</text>
<text x="484" y="532" font-size="15" fill="#8a95c0" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" opacity="1.0">so nothing is spent running them.</text>
<rect x="484" y="588" width="133" height="28" rx="14.0" fill="#ff7ae0" fill-opacity="0.12" stroke="#ff7ae0" stroke-width="1.4"/>
<text x="550.4" y="606.32" font-size="12" fill="#ff7ae0" font-weight="600" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" opacity="1.0">client outbound</text>
<rect x="828" y="432" width="342" height="208" rx="14" fill="#141b32" fill-opacity="0.85" stroke="#6ce0ff" stroke-width="1.6"/>
<rect x="828" y="432" width="4" height="208" rx="2" fill="#6ce0ff"/>
<text x="850" y="476" font-size="19" fill="#e7ecff" font-weight="700" text-anchor="start" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" opacity="1.0">Fault injection in test</text>
<text x="850" y="510" font-size="15" fill="#8a95c0" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" opacity="1.0">Make the booth act up on purpose.</text>
<text x="850" y="532" font-size="15" fill="#8a95c0" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" opacity="1.0">Delete the interceptor in prod.</text>
<rect x="850" y="588" width="140" height="28" rx="14.0" fill="#6ce0ff" fill-opacity="0.12" stroke="#6ce0ff" stroke-width="1.4"/>
<text x="919.76" y="606.32" font-size="12" fill="#6ce0ff" font-weight="600" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" opacity="1.0">activity inbound</text>
<g transform="translate(1150 700) scale(0.68)"><g transform="rotate(-24) translate(-30 -6)" opacity="0.85"><ellipse cx="0" cy="0" rx="13" ry="16" fill="#141b32" stroke="#b58bff" stroke-width="1.8"/><rect x="-2.5" y="-46" width="5" height="32" rx="2" fill="#141b32" stroke="#b58bff" stroke-width="1.6"/><circle cx="0" cy="2" r="4" fill="none" stroke="#b58bff" stroke-width="1.4"/></g><path d="M-27 20 L-23 -24 Q-23 -38 0 -38 Q23 -38 23 -24 L27 20 Z" fill="#1b2444" stroke="#6ce0ff" stroke-width="2.2" stroke-linejoin="round"/><path d="M0 -34 V20" stroke="#6ce0ff" stroke-width="1.4" opacity="0.7"/><path d="M-11 -36 l11 10 11 -10" fill="none" stroke="#6ce0ff" stroke-width="1.8"/><circle cx="0" cy="-54" r="17" fill="#1b2444" stroke="#6ce0ff" stroke-width="2.2"/><path d="M-17 -56 q0 -17 17 -17 q17 0 17 17 q-5 -9 -17 -9 q-12 0 -17 9 z" fill="#263056" stroke="#6ce0ff" stroke-width="1.8"/><rect x="-12" y="-60" width="24" height="8" rx="3" fill="#0d132a" stroke="#6ce0ff" stroke-width="1.6"/><path d="M-11 -47 q11 13 22 0 q-3 11 -11 11 q-8 0 -11 -11 z" fill="#263056" stroke="#6ce0ff" stroke-width="1.6"/></g>
</svg>
