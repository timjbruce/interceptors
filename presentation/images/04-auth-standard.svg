<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<defs><marker id="a-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6ce0ff"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b58bff"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3ad29f"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ff6b8b"/></marker><marker id="a-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ffcf6b"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a95c0"/></marker><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e7ecff"/></marker><radialGradient id="halo" cx="72%" cy="-6%" r="80%"><stop offset="0" stop-color="#1a2450"/><stop offset="1" stop-color="#0b1020"/></radialGradient><linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6ce0ff" stop-opacity="0.14"/><stop offset="1" stop-color="#b58bff" stop-opacity="0.05"/></linearGradient><pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0 H0 V48" fill="none" stroke="#263056" stroke-width="1"/></pattern><linearGradient id="tlogo" x1="183" y1="192" x2="0" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#444CE7"/><stop offset="1" stop-color="#B664FF"/></linearGradient><filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="1280" height="720" fill="url(#halo)"/>
<rect width="1280" height="720" fill="url(#grid)" opacity="0.35"/>
<rect x="72" y="60" width="5" height="92" rx="2.5" fill="#3ad29f"/>
<text x="100" y="100" font-size="42" fill="#e7ecff" font-weight="700" text-anchor="start" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" opacity="1.0">The standard for authentication and authorization</text>
<text x="100" y="140" font-size="21" fill="#8a95c0" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" opacity="1.0">Three credentials, three jobs. Only one of them opens a door.</text>
<text x="112" y="174" font-size="12" fill="#8a95c0" font-weight="700" text-anchor="start" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" opacity="1.0" letter-spacing="1.2">WHEN</text>
<text x="268" y="174" font-size="12" fill="#8a95c0" font-weight="700" text-anchor="start" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" opacity="1.0" letter-spacing="1.2">CREDENTIAL</text>
<text x="606" y="174" font-size="12" fill="#8a95c0" font-weight="700" text-anchor="start" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" opacity="1.0" letter-spacing="1.2">THE CLAIMS THAT DECIDE</text>
<text x="1000" y="174" font-size="12" fill="#8a95c0" font-weight="700" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" opacity="1.0" letter-spacing="1.2">LIFETIME</text>
<text x="1170" y="174" font-size="12" fill="#8a95c0" font-weight="700" text-anchor="end" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" opacity="1.0" letter-spacing="1.2">OPENS A DOOR</text>
<rect x="88" y="190" width="1104" height="112" rx="12" fill="#141b32" fill-opacity="0.8" stroke="#263056" stroke-width="1.4"/>
<rect x="88" y="190" width="4" height="112" rx="2" fill="#8a95c0"/>
<text x="112" y="252" font-size="13" fill="#8a95c0" font-weight="700" text-anchor="start" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" opacity="1.0" letter-spacing="1.0">AT LOGIN</text>
<text x="268" y="234" font-size="20" fill="#e7ecff" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', 'SF Mono', Menlo, ui-monospace, monospace" opacity="1.0">session license</text>
<text x="268" y="262" font-size="15" fill="#e7ecff" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" opacity="0.85">A signed JWT. This traveler is</text>
<text x="268" y="284" font-size="15" fill="#e7ecff" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" opacity="0.85">here now.</text>
<text x="606" y="232" font-size="15" fill="#e7ecff" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', 'SF Mono', Menlo, ui-monospace, monospace" opacity="1.0">sub</text>
<text x="714" y="232" font-size="15" fill="#8a95c0" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" opacity="1.0">who is here</text>
<text x="606" y="262" font-size="15" fill="#e7ecff" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', 'SF Mono', Menlo, ui-monospace, monospace" opacity="1.0">group</text>
<text x="714" y="262" font-size="15" fill="#8a95c0" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" opacity="1.0">what they may run</text>
<text x="1000" y="252" font-size="16" fill="#e7ecff" font-weight="600" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', Menlo, ui-monospace, monospace" opacity="0.9">15 min</text>
<text x="1170" y="252" font-size="16" fill="#8a95c0" font-weight="400" text-anchor="end" font-family="'JetBrains Mono', 'SF Mono', Menlo, ui-monospace, monospace" opacity="1.0">no</text>
<rect x="88" y="316" width="1104" height="112" rx="12" fill="#141b32" fill-opacity="0.8" stroke="#263056" stroke-width="1.4"/>
<rect x="88" y="316" width="4" height="112" rx="2" fill="#8a95c0"/>
<text x="112" y="378" font-size="13" fill="#8a95c0" font-weight="700" text-anchor="start" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" opacity="1.0" letter-spacing="1.0">ON THE HEADER</text>
<text x="268" y="360" font-size="20" fill="#e7ecff" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', 'SF Mono', Menlo, ui-monospace, monospace" opacity="1.0">delegation grant</text>
<text x="268" y="388" font-size="15" fill="#e7ecff" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" opacity="0.85">Who a service may act for, later.</text>
<text x="606" y="358" font-size="15" fill="#e7ecff" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', 'SF Mono', Menlo, ui-monospace, monospace" opacity="1.0">aud</text>
<text x="714" y="358" font-size="15" fill="#8a95c0" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" opacity="1.0">the token endpoint, only</text>
<text x="606" y="388" font-size="15" fill="#e7ecff" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', 'SF Mono', Menlo, ui-monospace, monospace" opacity="1.0">may_act</text>
<text x="714" y="388" font-size="15" fill="#8a95c0" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" opacity="1.0">one named worker</text>
<text x="1000" y="378" font-size="16" fill="#e7ecff" font-weight="600" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', Menlo, ui-monospace, monospace" opacity="0.9">8 hours</text>
<text x="1170" y="378" font-size="16" fill="#8a95c0" font-weight="400" text-anchor="end" font-family="'JetBrains Mono', 'SF Mono', Menlo, ui-monospace, monospace" opacity="1.0">no</text>
<rect x="88" y="442" width="1104" height="112" rx="12" fill="#141b32" fill-opacity="0.95" stroke="#3ad29f" stroke-width="1.8"/>
<rect x="88" y="442" width="4" height="112" rx="2" fill="#3ad29f"/>
<text x="112" y="504" font-size="13" fill="#8a95c0" font-weight="700" text-anchor="start" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" opacity="1.0" letter-spacing="1.0">AT THE CALL</text>
<text x="268" y="486" font-size="20" fill="#3ad29f" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', 'SF Mono', Menlo, ui-monospace, monospace" opacity="1.0">access token</text>
<text x="268" y="514" font-size="15" fill="#e7ecff" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" opacity="0.85">This call, this service, this</text>
<text x="268" y="536" font-size="15" fill="#e7ecff" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" opacity="0.85">traveler.</text>
<text x="606" y="484" font-size="15" fill="#3ad29f" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', 'SF Mono', Menlo, ui-monospace, monospace" opacity="1.0">sub + act</text>
<text x="714" y="484" font-size="15" fill="#8a95c0" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" opacity="1.0">the traveler, and the worker</text>
<text x="606" y="514" font-size="15" fill="#3ad29f" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', 'SF Mono', Menlo, ui-monospace, monospace" opacity="1.0">aud</text>
<text x="714" y="514" font-size="15" fill="#8a95c0" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" opacity="1.0">the backend</text>
<text x="1000" y="504" font-size="16" fill="#3ad29f" font-weight="600" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', Menlo, ui-monospace, monospace" opacity="0.9">2 min</text>
<circle cx="1153" cy="498" r="17" fill="#3ad29f" fill-opacity="0.15" stroke="#3ad29f" stroke-width="1.8"/><path d="M1146 498 l5.5 6 l9 -12" fill="none" stroke="#3ad29f" stroke-width="2.8" stroke-linecap="round"/>
<rect x="88" y="570" width="1104" height="116" rx="10" fill="#3ad29f" fill-opacity="0.10" stroke="#3ad29f" stroke-opacity="0.5" stroke-width="1.4"/>
<rect x="88" y="570" width="5" height="116" rx="2.5" fill="#3ad29f"/>
<text x="101" y="599" font-size="14" fill="#3ad29f" font-weight="700" text-anchor="start" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" opacity="1.0" letter-spacing="1.2">THE RULE, WHEREVER THIS RUNS</text>
<text x="101" y="623" font-size="16" fill="#e7ecff" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" opacity="0.92">The license carries the group. What that group is allowed to run is our policy, not the token's.</text>
<text x="101" y="645" font-size="16" fill="#e7ecff" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" opacity="0.92">The grant opens nothing at all: audience-locked to the token endpoint, redeemable by one named worker.</text>
<text x="101" y="667" font-size="16" fill="#e7ecff" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" opacity="0.92">Only the exchanged access token opens a door, and only for the two minutes the call needs.</text>
</svg>
