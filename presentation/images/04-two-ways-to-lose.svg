<text x="106" y="583" font-size="14" fill="#ff6b8b" font-weight="700" text-anchor="start" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" opacity="1.0" letter-spacing="1.2">WHAT WAS ACTUALLY AT RISK</text>
<text x="106" y="607" font-size="17" fill="#e7ecff" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" opacity="0.92">One universe nearly went to De Nomolos. A head of state was left on a water slide.</text>
<text x="106" y="631" font-size="17" fill="#e7ecff" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" opacity="0.92">Neither was a durability problem. Both were the business asking a question the software could not answer.</text>
