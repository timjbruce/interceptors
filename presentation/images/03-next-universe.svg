<circle cx="574" cy="492" r="17" fill="#6ce0ff" fill-opacity="0.14" stroke="#6ce0ff" stroke-width="1.6"/>
<text x="574" y="498" font-size="15" fill="#6ce0ff" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', Menlo, ui-monospace, monospace" opacity="1.0">5</text>
<text x="606" y="498" font-size="19" fill="#e7ecff" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" opacity="1.0">Auditors can see exactly who each action was for.</text>
