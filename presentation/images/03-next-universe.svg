<text x="606" y="266" font-size="19" fill="#e7ecff" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" opacity="1.0">Only real travelers ever ride the booth.</text>
<circle cx="574" cy="318" r="17" fill="#6ce0ff" fill-opacity="0.14" stroke="#6ce0ff" stroke-width="1.6"/>
<text x="574" y="324" font-size="15" fill="#6ce0ff" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', Menlo, ui-monospace, monospace" opacity="1.0">2</text>
<text x="606" y="324" font-size="19" fill="#e7ecff" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" opacity="1.0">Only cleared travelers can run Save the Future.</text>
<circle cx="574" cy="376" r="17" fill="#6ce0ff" fill-opacity="0.14" stroke="#6ce0ff" stroke-width="1.6"/>
<text x="574" y="382" font-size="15" fill="#6ce0ff" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', Menlo, ui-monospace, monospace" opacity="1.0">3</text>
<text x="606" y="382" font-size="19" fill="#e7ecff" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" opacity="1.0">We can prove who approved a trip, and when.</text>
<circle cx="574" cy="434" r="17" fill="#6ce0ff" fill-opacity="0.14" stroke="#6ce0ff" stroke-width="1.6"/>
<text x="574" y="440" font-size="15" fill="#6ce0ff" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', Menlo, ui-monospace, monospace" opacity="1.0">4</text>
