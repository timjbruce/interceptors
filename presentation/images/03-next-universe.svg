<text x="606" y="590" font-size="20" fill="#ffcf6b" font-weight="700" text-anchor="start" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" opacity="1.0">True of every system we run.</text>
<text x="606" y="616" font-size="18" fill="#ffcf6b" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" opacity="0.85">Not just the booth, Rufus.</text>
