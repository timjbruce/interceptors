<text x="1162" y="422" font-size="12" fill="#8a95c0" font-weight="400" text-anchor="end" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" opacity="1.0">workflow in and out, activity in</text>
