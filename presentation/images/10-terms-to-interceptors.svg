<path d="M566 482 L606 482" fill="none" stroke="#8a95c0" stroke-width="2" marker-end="url(#a-muted)"/>
<rect x="614" y="454" width="570" height="56" rx="12" fill="#1b2444" fill-opacity="0.85" stroke="#b58bff" stroke-width="1.6"/>
<text x="636" y="488" font-size="16" fill="#b58bff" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', 'SF Mono', Menlo, ui-monospace, monospace" opacity="1.0">grant_propagation + token_exchange</text>
<text x="1162" y="488" font-size="12" fill="#8a95c0" font-weight="400" text-anchor="end" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" opacity="1.0">workflow in and out, activity in</text>
<circle cx="118" cy="548" r="17" fill="#3ad29f" fill-opacity="0.14" stroke="#3ad29f" stroke-width="1.8"/>
<text x="118" y="554" font-size="15" fill="#3ad29f" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', Menlo, ui-monospace, monospace" opacity="1.0">6</text>
<rect x="154" y="520" width="402" height="56" rx="12" fill="#141b32" fill-opacity="0.85" stroke="#263056" stroke-width="1.6"/>
<text x="176" y="555" font-size="20" fill="#e7ecff" font-weight="600" text-anchor="start" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" opacity="1.0">Can be added to every workflow</text>
<path d="M566 548 L606 548" fill="none" stroke="#8a95c0" stroke-width="2" marker-end="url(#a-muted)"/>
<rect x="614" y="520" width="570" height="56" rx="12" fill="#1b2444" fill-opacity="0.85" stroke="#3ad29f" stroke-width="1.6"/>
<text x="636" y="554" font-size="16" fill="#3ad29f" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', 'SF Mono', Menlo, ui-monospace, monospace" opacity="1.0">all six, wired up the same way</text>
<rect x="154" y="588" width="1030" height="108" rx="10" fill="#3ad29f" fill-opacity="0.10" stroke="#3ad29f" stroke-opacity="0.5" stroke-width="1.4"/>
<rect x="154" y="588" width="5" height="108" rx="2.5" fill="#3ad29f"/>
<text x="172" y="623" font-size="14" fill="#3ad29f" font-weight="700" text-anchor="start" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" opacity="1.0" letter-spacing="1.2">INTERCEPTORS HELP MEET REQUIREMENT 6</text>
<text x="172" y="647" font-size="17" fill="#e7ecff" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" opacity="0.92">One is wired into every client that starts a trip. Five are wired once on the worker</text>
<text x="172" y="671" font-size="17" fill="#e7ecff" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" opacity="0.92">and inherited by every workflow there, including the ones nobody has written yet.</text>
