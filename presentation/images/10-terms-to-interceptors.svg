<text x="1162" y="356" font-size="12" fill="#8a95c0" font-weight="400" text-anchor="end" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" opacity="1.0">workflow inbound</text>
<circle cx="118" cy="416" r="17" fill="#b58bff" fill-opacity="0.14" stroke="#b58bff" stroke-width="1.8"/>
<text x="118" y="422" font-size="15" fill="#b58bff" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', Menlo, ui-monospace, monospace" opacity="1.0">4</text>
