<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<defs><marker id="a-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6ce0ff"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b58bff"/></marker><marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3ad29f"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ff6b8b"/></marker><marker id="a-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ffcf6b"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a95c0"/></marker><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e7ecff"/></marker><radialGradient id="halo" cx="72%" cy="-6%" r="80%"><stop offset="0" stop-color="#1a2450"/><stop offset="1" stop-color="#0b1020"/></radialGradient><linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6ce0ff" stop-opacity="0.14"/><stop offset="1" stop-color="#b58bff" stop-opacity="0.05"/></linearGradient><pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0 H0 V48" fill="none" stroke="#263056" stroke-width="1"/></pattern><linearGradient id="tlogo" x1="183" y1="192" x2="0" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#444CE7"/><stop offset="1" stop-color="#B664FF"/></linearGradient><filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="1280" height="720" fill="url(#halo)"/>
<rect width="1280" height="720" fill="url(#grid)" opacity="0.35"/>
<rect x="72" y="60" width="5" height="92" rx="2.5" fill="#6ce0ff"/>
<text x="100" y="100" font-size="42" fill="#e7ecff" font-weight="700" text-anchor="start" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" opacity="1.0">How to build one</text>
<text x="100" y="140" font-size="21" fill="#8a95c0" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" opacity="1.0">Three moves. The SDK does the chaining.</text>
<rect x="96" y="170" width="340" height="104" rx="12" fill="#141b32" fill-opacity="0.85" stroke="#6ce0ff" stroke-width="1.6"/>
<circle cx="126" cy="204" r="15" fill="#6ce0ff" fill-opacity="0.14" stroke="#6ce0ff" stroke-width="1.8"/>
<text x="126" y="210" font-size="14" fill="#6ce0ff" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', Menlo, ui-monospace, monospace" opacity="1.0">1</text>
<text x="152" y="210" font-size="17" fill="#e7ecff" font-weight="700" text-anchor="start" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" opacity="1.0">Extend the class that intercepts</text>
<text x="116" y="240" font-size="13" fill="#8a95c0" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" opacity="1.0">worker.Interceptor on a worker,</text>
<text x="116" y="260" font-size="13" fill="#8a95c0" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" opacity="1.0">client.Interceptor on a client.</text>
<rect x="470" y="170" width="340" height="104" rx="12" fill="#141b32" fill-opacity="0.85" stroke="#6ce0ff" stroke-width="1.6"/>
<circle cx="500" cy="204" r="15" fill="#6ce0ff" fill-opacity="0.14" stroke="#6ce0ff" stroke-width="1.8"/>
<text x="500" y="210" font-size="14" fill="#6ce0ff" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', Menlo, ui-monospace, monospace" opacity="1.0">2</text>
<text x="526" y="210" font-size="17" fill="#e7ecff" font-weight="700" text-anchor="start" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" opacity="1.0">Override, then call through</text>
<text x="490" y="240" font-size="13" fill="#8a95c0" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" opacity="1.0">super() runs the rest of the chain.</text>
<text x="490" y="260" font-size="13" fill="#8a95c0" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" opacity="1.0">Skip it and the operation never happens.</text>
<rect x="844" y="170" width="340" height="104" rx="12" fill="#141b32" fill-opacity="0.85" stroke="#6ce0ff" stroke-width="1.6"/>
<circle cx="874" cy="204" r="15" fill="#6ce0ff" fill-opacity="0.14" stroke="#6ce0ff" stroke-width="1.8"/>
<text x="874" y="210" font-size="14" fill="#6ce0ff" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', Menlo, ui-monospace, monospace" opacity="1.0">3</text>
<text x="900" y="210" font-size="17" fill="#e7ecff" font-weight="700" text-anchor="start" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" opacity="1.0">Hand yours back</text>
<text x="864" y="240" font-size="13" fill="#8a95c0" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" opacity="1.0">An instance, or for workflows the class,</text>
<text x="864" y="260" font-size="13" fill="#8a95c0" font-weight="400" text-anchor="start" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" opacity="1.0">and the SDK builds it into the chain.</text>
<rect x="96" y="292" width="1088" height="336" rx="14" fill="#141b32" fill-opacity="0.7" stroke="#263056" stroke-width="1.6"/>
<text x="118" y="326" font-size="17" fill="#8a95c0" font-weight="700" text-anchor="start" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" opacity="1.0" letter-spacing="1.2">workflows/interceptors/workflow_audit.py</text>
<line x1="118" y1="342" x2="1162" y2="342" stroke="#263056" stroke-width="1"/>
<text x="120" y="362" font-size="15" fill="#e7ecff" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', 'SF Mono', Menlo, ui-monospace, monospace" opacity="0.95" xml:space="preserve">class WorkflowAuditInterceptor(Interceptor):</text>
<circle cx="1148" cy="357" r="13" fill="#6ce0ff" fill-opacity="0.14" stroke="#6ce0ff" stroke-width="1.6"/>
<text x="1148" y="362" font-size="13" fill="#6ce0ff" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', Menlo, ui-monospace, monospace" opacity="1.0">1</text>
<text x="120" y="382" font-size="15" fill="#e7ecff" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', 'SF Mono', Menlo, ui-monospace, monospace" opacity="0.95" xml:space="preserve">    def workflow_interceptor_class(</text>
<text x="120" y="402" font-size="15" fill="#e7ecff" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', 'SF Mono', Menlo, ui-monospace, monospace" opacity="0.95" xml:space="preserve">        self, input: WorkflowInterceptorClassInput</text>
<text x="120" y="422" font-size="15" fill="#e7ecff" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', 'SF Mono', Menlo, ui-monospace, monospace" opacity="0.95" xml:space="preserve">    ) -&gt; Optional[Type[WorkflowInboundInterceptor]]:</text>
<text x="120" y="442" font-size="15" fill="#e7ecff" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', 'SF Mono', Menlo, ui-monospace, monospace" opacity="0.95" xml:space="preserve">        return _AuditWorkflowInbound</text>
<circle cx="1148" cy="437" r="13" fill="#6ce0ff" fill-opacity="0.14" stroke="#6ce0ff" stroke-width="1.6"/>
<text x="1148" y="442" font-size="13" fill="#6ce0ff" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', Menlo, ui-monospace, monospace" opacity="1.0">3</text>
<text x="120" y="482" font-size="15" fill="#e7ecff" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', 'SF Mono', Menlo, ui-monospace, monospace" opacity="0.95" xml:space="preserve">class _AuditWorkflowInbound(WorkflowInboundInterceptor):</text>
<circle cx="1148" cy="477" r="13" fill="#6ce0ff" fill-opacity="0.14" stroke="#6ce0ff" stroke-width="1.6"/>
<text x="1148" y="482" font-size="13" fill="#6ce0ff" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', Menlo, ui-monospace, monospace" opacity="1.0">2</text>
<text x="120" y="502" font-size="15" fill="#e7ecff" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', 'SF Mono', Menlo, ui-monospace, monospace" opacity="0.95" xml:space="preserve">    async def handle_signal(self, input: HandleSignalInput) -&gt; None:</text>
<text x="120" y="522" font-size="15" fill="#e7ecff" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', 'SF Mono', Menlo, ui-monospace, monospace" opacity="0.95" xml:space="preserve">        workflow.logger.info("signal received: %s", input.signal)</text>
<text x="120" y="542" font-size="15" fill="#e7ecff" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', 'SF Mono', Menlo, ui-monospace, monospace" opacity="0.95" xml:space="preserve">        await super().handle_signal(input)</text>
<circle cx="1148" cy="537" r="13" fill="#6ce0ff" fill-opacity="0.14" stroke="#6ce0ff" stroke-width="1.6"/>
<text x="1148" y="542" font-size="13" fill="#6ce0ff" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', Menlo, ui-monospace, monospace" opacity="1.0">2</text>
<text x="120" y="582" font-size="15" fill="#e7ecff" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', 'SF Mono', Menlo, ui-monospace, monospace" opacity="0.95" xml:space="preserve">    async def handle_query(self, input: HandleQueryInput) -&gt; Any:</text>
<text x="120" y="602" font-size="15" fill="#e7ecff" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', 'SF Mono', Menlo, ui-monospace, monospace" opacity="0.95" xml:space="preserve">        workflow.logger.info("query received: %s", input.query)</text>
<text x="120" y="622" font-size="15" fill="#e7ecff" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', 'SF Mono', Menlo, ui-monospace, monospace" opacity="0.95" xml:space="preserve">        return await super().handle_query(input)</text>
<circle cx="1148" cy="617" r="13" fill="#6ce0ff" fill-opacity="0.14" stroke="#6ce0ff" stroke-width="1.6"/>
<text x="1148" y="622" font-size="13" fill="#6ce0ff" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', Menlo, ui-monospace, monospace" opacity="1.0">2</text>
<rect x="96" y="638" width="1088" height="58" rx="12" fill="#1b2444" fill-opacity="0.7" stroke="#3ad29f" stroke-width="1.6"/>
<text x="120" y="674" font-size="16" fill="#3ad29f" font-weight="700" text-anchor="start" font-family="'JetBrains Mono', 'SF Mono', Menlo, ui-monospace, monospace" opacity="1.0">Worker(client, ..., interceptors=[WorkflowAuditInterceptor()])</text>
<text x="1160" y="674" font-size="15" fill="#8a95c0" font-weight="400" text-anchor="end" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" opacity="1.0">wired once, every workflow on this worker</text>
</svg>
